<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Try-On</title>
  <link rel="stylesheet" href="widget.css" />
</head>
<body data-mode="idle">
  <header>
    <strong>Live Try-On</strong>
    <span id="timer" class="timer"></span>
    <button id="grow" class="icon" type="button" title="Bigger / smaller">⤢</button>
    <button id="close" class="icon" type="button" title="Close">✕</button>
  </header>

  <main id="screen">
    <video id="local" autoplay playsinline muted></video>
    <video id="output" autoplay playsinline muted></video>

    <div id="idle" class="idle">
      <p>Hover any product picture and click <b>Try On</b>.<br />Or drop / paste a garment picture here.</p>
      <button id="product" class="primary" type="button" hidden>Try on this item</button>
      <button id="resume" type="button" hidden>Try again</button>
      <label class="btn">Choose picture<input id="file" type="file" accept="image/*" hidden /></label>
    </div>

    <img id="thumb" class="thumb" alt="Garment" hidden />
    <div id="status" class="status"></div>
    <button id="openWindow" class="float" type="button" hidden>Open in its own window</button>
  </main>

  <footer>
    <select id="category" title="What kind of item is it?">
      <option value="top">Top / shirt</option>
      <option value="outerwear">Jacket / coat</option>
      <option value="dress">Dress</option>
      <option value="bottom">Pants / skirt</option>
      <option value="shoes">Shoes</option>
      <option value="hat">Hat / cap</option>
      <option value="eyewear">Glasses</option>
    </select>
    <button id="snap" class="icon live-only" type="button" title="Save photo">⭳</button>
    <button id="stop" class="busy-only" type="button">Stop</button>
    <button id="cart" class="primary" type="button" hidden>Add to cart</button>
  </footer>
  <p class="privacy">While live, your camera video is sent to Decart's AI to draw the outfit on you.</p>

  <script type="module" src="widget.js"></script>
</body>
</html>
